<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">
  <style>
    .icon { animation: float 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .i2 { animation-delay: .2s; }
    .i3 { animation-delay: .4s; }
    .i4 { animation-delay: .6s; }
    .i5 { animation-delay: .8s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>

  <!-- HTML5 -->
  <g class="icon i1" transform="translate(20 18)">
    <path fill="#E44D26" d="M0 0h80l-7 80-33 12L7 80z"/>
    <path fill="#F16529" d="M40 7v77l27-10 6-67z"/>
    <path fill="#fff" d="M17 18h46l-2 9H28l1 10h31l-3 31-17 6-17-6-1-16h10l1 9 7 2 7-2 1-15H20z"/>
  </g>

  <!-- CSS3 -->
  <g class="icon i2" transform="translate(150 18)">
    <path fill="#1572B6" d="M0 0h80l-7 80-33 12L7 80z"/>
    <path fill="#33A9DC" d="M40 7v77l27-10 6-67z"/>
    <path fill="#fff" d="M17 18h46l-1 9H27l1 10h34l-3 31-19 6-18-6-1-16h10l1 9 8 2 8-2 1-15H19z"/>
  </g>

  <!-- JavaScript -->
  <g class="icon i3" transform="translate(280 18)">
    <rect width="80" height="80" rx="4" fill="#F7DF1E"/>
    <text x="40" y="59" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#111">JS</text>
  </g>

  <!-- Python -->
  <g class="icon i4" transform="translate(410 18)">
    <path fill="#3776AB" d="M40 0c-18 0-16 8-16 8v12h17v4H18C7 24 4 31 4 40s3 16 14 16h7V44s0-8 8-8h17c8 0 9-6 9-12V12S60 0 40 0z"/>
    <circle cx="31" cy="10" r="3" fill="#fff"/>
    <path fill="#FFD343" d="M40 80c18 0 16-8 16-8V60H39v-4h23c11 0 14-7 14-16s-3-16-14-16h-7v12s0 8-8 8H30c-8 0-9 6-9 12v12s-1 12 19 12z"/>
    <circle cx="49" cy="70" r="3" fill="#fff"/>
  </g>

  <!-- C++ -->
  <g class="icon i5" transform="translate(540 18)">
    <circle cx="40" cy="40" r="38" fill="#00599C"/>
    <path fill="#fff" d="M58 29v7h-5v5h5v7h6v-7h5v-5h-5v-7z"/>
    <path fill="#fff" d="M40 29c-9 0-16 7-16 16s7 16 16 16c5 0 10-2 13-6l-7-5c-2 2-4 3-6 3-4 0-7-3-7-8s3-8 7-8c2 0 4 1 6 3l7-5c-3-4-8-6-13-6z"/>
  </g>
</svg>
