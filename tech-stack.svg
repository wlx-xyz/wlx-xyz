<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">

  <style>
    .icon {
      animation: float 2s ease-in-out infinite;
    }

    .i2 { animation-delay: .2s; }
    .i3 { animation-delay: .4s; }
    .i4 { animation-delay: .6s; }
    .i5 { animation-delay: .8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <g class="icon i1">
    <image
      href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
      x="20" y="20" width="80" height="80"/>
  </g>

  <g class="icon i2">
    <image
      href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
      x="150" y="20" width="80" height="80"/>
  </g>

  <g class="icon i3">
    <image
      href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
      x="280" y="20" width="80" height="80"/>
  </g>

  <g class="icon i4">
    <image
      href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg"
      x="410" y="20" width="80" height="80"/>
  </g>

  <g class="icon i5">
    <image
      href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg"
      x="540" y="20" width="80" height="80"/>
  </g>

</svg>
