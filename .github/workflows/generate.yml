name: ASCII Profile Card

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest

    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            card:
              lines:
                - { type: header, text: "wlx-xyz" }
                - { type: kv, key: Role, value: "Student" }
                - { type: kv, key: Focus, value: "IT / Linux" }
                - { type: kv, key: Interests, value: "Minecraft / Gaming" }
                - { type: section, title: "GitHub stats" }
                - { type: kv, key: Repositories, value: "{repos}" }
                - { type: kv, key: Stars, value: "{stars}" }
                - { type: kv, key: Followers, value: "{followers}" }
                - { type: kv, key: Contributions, value: "{contributions}" }
                - { type: kv, key: Languages, value: "{topLanguages}" }
